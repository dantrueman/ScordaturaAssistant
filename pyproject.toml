[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "scordatura"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
    "music21>=8.3.0",
    "flask>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
scordatura = ["templates/*.html"]
